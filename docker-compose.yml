version: "3.8"

services:
  postgres-master:
    image: bitnami/postgresql:latest
    container_name: pg-master
    environment:
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_USERNAME=appuser
      - POSTGRESQL_PASSWORD=apppass
      - POSTGRESQL_DATABASE=webmanh
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_pass
    volumes:
      - pg_master_data:/bitnami/postgresql

  postgres-slave:
    image: bitnami/postgresql:latest
    container_name: pg-slave
    depends_on:
      - postgres-master
    environment:
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_MASTER_HOST=postgres-master
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_pass
      - POSTGRESQL_PASSWORD=apppass
    volumes:
      - pg_slave_data:/bitnami/postgresql
  load_balancer:
    image: nginx:stable-perl
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # sau khi tìm hiểu sâu hơn về nginx, ta sẽ đưa nó vào file config khác
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  pg_master_data:
  pg_slave_data: