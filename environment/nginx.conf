events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=lb_limit:10m rate=100r/s;
    limit_req_status 429; # too many requests

    # Định nghĩa nhóm server (Upstream)
    upstream my_servers {
        # Round Robin là mặc định
        server host.docker.internal:8081;
        server host.docker.internal:8082; # tương lai đóng gói instance
    }

    server {
        listen 80;

        location / {
            limit_req zone=lb_limit burst=40 nodelay; # cho phép 40 request chờ trong hàng đợi
            
            proxy_pass http://my_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr; # backend chỉ thấy IP của nginx, lưu địa chỉ IP gốc của client
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}