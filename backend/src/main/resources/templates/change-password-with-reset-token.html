<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu WebManh</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 520px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h2 {
            color: #333333;
        }

        p {
            color: #555555;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 12px 24px;
            background-color: #2563eb;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .btn:hover {
            background-color: #1e40af;
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #888888;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Xin chào <span th:text="${username}">User</span>,</h2>

    <p>
        Chúng tôi nhận được yêu cầu <b>đổi mật khẩu</b> cho tài khoản WebManh của bạn.
    </p>

    <p>
        Vui lòng nhấn vào nút bên dưới để tiếp tục:
    </p>

    <!-- BUTTON – link được hide -->
    <a th:href="${resetUrl}" class="btn">
        Đổi mật khẩu
    </a>

    <p class="footer">
        Nếu bạn không yêu cầu đổi mật khẩu, vui lòng bỏ qua email này.
        <br/>
        Link sẽ hết hạn sau một khoảng thời gian vì lý do bảo mật.
    </p>
</div>

</body>
</html>
