<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác thực tài khoản</title>
</head>

<body style="margin:0; padding:0; background-color:#f4f6f8; font-family:Arial, Helvetica, sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center" style="padding: 40px 0;">
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border-radius:8px; overflow:hidden;">

                <!-- Header -->
                <tr>
                    <td style="background-color:#4f46e5; padding:20px; text-align:center;">
                        <h1 style="color:#ffffff; margin:0;">WebManh</h1>
                    </td>
                </tr>

                <!-- Content -->
                <tr>
                    <td style="padding:30px;">
                        <h2 style="color:#333;">
                            Xin chào <span th:text="${username}">User</span> 👋
                        </h2>

                        <p style="color:#555; font-size:15px; line-height:1.6;">
                            Cảm ơn bạn đã đăng ký tài khoản tại <strong>WebManh</strong>.
                        </p>

                        <p style="color:#555; font-size:15px;">
                            Vui lòng nhấn nút bên dưới để xác thực email của bạn:
                        </p>

                        <!-- Button -->
                        <div style="text-align:center; margin:30px 0;">
                            <a th:href="${verifyUrl}"
                               style="background-color:#4f46e5;
                                      color:#ffffff;
                                      padding:14px 28px;
                                      text-decoration:none;
                                      border-radius:6px;
                                      font-weight:bold;
                                      display:inline-block;">
                                Xác thực tài khoản
                            </a>
                        </div>

                        <p style="color:#777; font-size:14px;">
                            Hoặc copy link sau vào trình duyệt:
                        </p>

                        <p style="word-break:break-all; font-size:13px; color:#4f46e5;">
                            <span th:text="${verifyUrl}">https://webmanh.com/verify?token=xxx</span>
                        </p>

                        <p style="color:#999; font-size:13px; margin-top:30px;">
                            Link xác thực sẽ hết hạn sau <strong>15 phút</strong>.
                        </p>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td style="background-color:#f4f6f8; padding:20px; text-align:center;">
                        <p style="margin:0; font-size:12px; color:#999;">
                            © 2026 WebManh. All rights reserved.
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
