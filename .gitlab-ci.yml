stages:
  - build
  - deploy

before_script:
  - aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID"
  - aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY"
  - aws configure set default.region "$AWS_REGION"
  - aws sts get-caller-identity

build:
  stage: build

  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "staging"'

  script:
    - |
      set -e

      # 1. Xác định IMAGE_NAME theo branch/tag
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_NAME="${ECR_REPO_NAME:-humg/tranvietanh}-prod"
      elif [ "$CI_COMMIT_BRANCH" = "staging" ]; then
        IMAGE_NAME="${ECR_REPO_NAME:-humg/tranvietanh}-staging"
      else
        IMAGE_NAME="${ECR_REPO_NAME:-humg/tranvietanh}-dev"
      fi

      # 2. Xác định IMAGE_TAG theo branch/tag
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      else
        IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      fi

      echo "IMAGE_NAME=$IMAGE_NAME"
      echo "IMAGE_TAG=$IMAGE_TAG"
      echo "IMAGE_TAG=$IMAGE_TAG" > build.env

      # 3. Login ECR
      aws ecr get-login-password --region "$AWS_REGION" | \
        docker login \
          --username AWS \
          --password-stdin \
          "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      # 4. Build
      docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

      # 5. Tag
      docker tag \
        "$IMAGE_NAME:$IMAGE_TAG" \
        "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG"

      # 6. Push
      docker push \
        "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG"

      echo "=== Build & Push hoàn tất: $IMAGE_NAME:$IMAGE_TAG ==="

  artifacts:
    reports:
      dotenv: build.env

  tags:
    - gitlab-runner-reading


deploy:
  stage: deploy

  when: manual

  variables:
    GIT_STRATEGY: none

  rules:
    - if: '$CI_COMMIT_TAG'
      variables:
        DEPLOY_ENV: production

    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        DEPLOY_ENV: develop

    - if: '$CI_COMMIT_BRANCH == "staging"'
      variables:
        DEPLOY_ENV: staging

  environment:
    name: $DEPLOY_ENV

  script:
    - |
      set -e

      # Tính lại IMAGE_NAME theo branch/tag (deploy stage không kế thừa biến từ build stage)
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_NAME="${ECR_REPO_NAME:-humg/tranvietanh}-prod"
      elif [ "$CI_COMMIT_BRANCH" = "staging" ]; then
        IMAGE_NAME="${ECR_REPO_NAME:-humg/tranvietanh}-staging"
      else
        IMAGE_NAME="${ECR_REPO_NAME:-humg/tranvietanh}-dev"
      fi

      echo "Deploying Image Tag -> $IMAGE_TAG"
      echo "Environment        -> $DEPLOY_ENV"
      echo "IMAGE_NAME         -> $IMAGE_NAME"

      # 1. Lấy task definition hiện tại
      aws ecs describe-task-definition \
        --task-definition "$TASK_DEFINITION" \
        --query taskDefinition \
        > task-definition.json

      # 2. Thay image mới vào container definition
      jq \
        --arg IMAGE "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$IMAGE_NAME:$IMAGE_TAG" \
        --arg CONTAINER "$CONTAINER_NAME" \
        '
        .containerDefinitions |=
        map(
          if .name == $CONTAINER
          then .image = $IMAGE
          else .
          end
        )
        | del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )
        ' \
        task-definition.json \
        > new-task-definition.json

      # 3. Register task definition mới và lấy revision
      REVISION=$(aws ecs register-task-definition \
        --cli-input-json file://new-task-definition.json \
        --query 'taskDefinition.revision' \
        --output text)

      echo "New ECS Task Definition Revision: $REVISION"

      # 4. Update ECS service với revision mới
      aws ecs update-service \
        --cluster "$ECS_CLUSTER" \
        --service "$ECS_SERVICE" \
        --task-definition "$TASK_DEFINITION:$REVISION"

      echo "=== Deploy hoàn tất: $IMAGE_NAME:$IMAGE_TAG (revision: $REVISION) ==="

  tags:
    - gitlab-runner-reading